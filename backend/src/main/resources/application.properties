spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_records_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Railway (and most PaaS) inject their own PORT; falls back to 8080 locally.
server.port=${PORT:8080}

# ── Google Form drive submissions (linked Google Sheet) ──────────
# Spreadsheet ID from the sheet URL: docs.google.com/spreadsheets/d/<ID>/edit
google.forms.spreadsheet-id=13w_Kv1TvwYMqm_PFaiSpT6fTQBM7TJls1dEWih9QghY
# Tab name + range. Bare sheet name reads every populated column so newly
# added form questions (e.g. the JD upload) are never silently truncated
# by a hardcoded column letter again.
google.forms.sheet-range=Form Responses 1
# Path to the service-account JSON key. Prefix with classpath: to load
# from src/main/resources, or give an absolute file path.
google.forms.credentials-path=classpath:google-service-account.json
# How often to pull new form responses (ms). 300000 = 5 minutes.
google.forms.poll-interval-ms=300000

# ── Google Form student registrations (linked Google Sheet) ──────
google.student-forms.spreadsheet-id=1hXTCIFi-iICPswYUr8kLH4Euazjn_XP6XSYtTFqtiS0
google.student-forms.sheet-range=Form Responses 1!A1:BZ
google.student-forms.credentials-path=classpath:google-service-account.json
google.student-forms.poll-interval-ms=300000

# ── Outgoing email (selection notifications) ──────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Display name / from-address used on outgoing mail
prms.mail.from-name=PRMS Placement Cell
prms.mail.from-address=${spring.mail.username}
# Master switch — set to false to disable all outgoing mail (e.g. local dev)
prms.mail.enabled=true
# Login URL included in the welcome email sent when a student account is created
prms.frontend.login-url=http://localhost:5173/login

# ── Automatic drive-event reminders ───────────────────────────────
# On/off is controlled at runtime via the ReminderSettings DB row (see
# GET/PUT /reminder-settings) — these two are just the schedule shape.
prms.reminder.days-before=7
prms.reminder.cron=0 0 8 * * *